name: Bug report
description: Something in Shipcheck (CLI or website) doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security problems, please don't open an issue. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead?
      placeholder: |
        I ran `shipcheck` in a pnpm project and the tests check ran `npm test`…
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Output of `shipcheck --verbose` (or `--json --verbose`). Remove anything private first.
      render: text
  - type: textarea
    id: config
    attributes:
      label: .shipcheck.yml
      description: Your config file, if you have one.
      render: yaml
  - type: input
    id: version
    attributes:
      label: Shipcheck version
      description: Output of `shipcheck version --verbose`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11…
    validations:
      required: true
